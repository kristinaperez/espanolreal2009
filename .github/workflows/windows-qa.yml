name: Windows QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Run PowerShell acceptance
        run: ./scripts/qa/acceptance.ps1
      - name: Save QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qa-results
          path: qa-results.json
          if-no-files-found: warn
          retention-days: 14
